# Production: everything on one VPS. Run from this folder:
#   docker compose up -d --build
# Settings come from deploy/.env (copy .env.example). See "Running a real shop" in the README.
name: kaunter-prod

x-logging: &logging
  # Logs are the error record (there is no error tracker), so keep a week or so, but cap the disk use.
  driver: json-file
  options:
    max-size: "20m"
    max-file: "10"

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in deploy/.env}
      MYSQL_DATABASE: kaunter
      MYSQL_USER: kaunter
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in deploy/.env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    # No ports: only the other containers can reach the database.
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      retries: 30
    logging: *logging

  api:
    build: ../backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ENV: production
      DATABASE_URL: mysql+pymysql://kaunter:${MYSQL_PASSWORD}@mysql:3306/kaunter?charset=utf8mb4
      ALLOWED_ORIGINS: '["https://${DOMAIN:?set DOMAIN in deploy/.env}"]'
      PUBLIC_BASE_URL: https://${DOMAIN}
      COOKIE_SECURE: "true"
      BEHIND_PROXY: "true"
      RUN_SCHEDULER: "true"
      MEDIA_DIR: /app/media
      PAYMENT_GATEWAY: ${PAYMENT_GATEWAY:-none}
      GATEWAY_WEBHOOK_SECRET: ${GATEWAY_WEBHOOK_SECRET:-}
      BACKUP_STATUS_FILE: /backups/status.json
    volumes:
      - media:/app/media
      - backups:/backups:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *logging

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in deploy/.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data  # the HTTPS certificates
      - caddy-config:/config
    logging: *logging

  backup:
    build: ./backup
    restart: unless-stopped
    depends_on:
      # The API creates and migrates the tables; back up only once it has.
      api:
        condition: service_healthy
    environment:
      TZ: ${SHOP_TIMEZONE:-Asia/Kuala_Lumpur}
      MYSQL_PWD: ${MYSQL_ROOT_PASSWORD}
      # After the 4 am day close, before the shop opens.
      BACKUP_TIME: ${BACKUP_TIME:-04:30}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      # Optional off-server copy, e.g. "b2:my-bucket/kaunter". Configure the remote in deploy/rclone/rclone.conf.
      RCLONE_REMOTE: ${RCLONE_REMOTE:-}
    volumes:
      - backups:/backups
      - media:/media
      - ./rclone:/config/rclone:ro
    logging: *logging

volumes:
  mysql-data:
  media:
  backups:
  caddy-data:
  caddy-config:
