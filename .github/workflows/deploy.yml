name: Deploy

# Goes live automatically once CI has passed on a push to main. See deploy/CICD.md for the setup.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# One deploy at a time; a newer one waits for the running one rather than cutting it off.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check the deploy secrets are set
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          missing=""
          [ -n "$VPS_HOST" ] || missing="$missing VPS_HOST"
          [ -n "$VPS_USER" ] || missing="$missing VPS_USER"
          [ -n "$VPS_SSH_KEY" ] || missing="$missing VPS_SSH_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Deploy secrets not set:$missing. See deploy/CICD.md."
            exit 1
          fi

      - name: Deploy the tested commit
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          if [ -n "$VPS_KNOWN_HOSTS" ]; then
            printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::VPS_KNOWN_HOSTS not set; trusting the server's key on first sight. See deploy/CICD.md."
            ssh-keyscan -H "$VPS_HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          # The key may only run deploy/deploy.sh on the server; the commit to deploy is its one argument.
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$VPS_USER@$VPS_HOST" "$SHA"
