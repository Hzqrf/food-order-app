[project]
name = "kaunter-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "pymysql>=1.1",
    "cryptography>=43",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    "pillow>=11",
    "python-multipart>=0.0.12",
    "apscheduler>=3.10,<4",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = ["pytest>=8", "httpx2"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
